# Production stack for a self-managed server. Everything runs on one host:
# Caddy terminates TLS and proxies to the web SPA and the API, Postgres and
# Redis stay on a private network with no published ports, MinIO holds the
# uploaded documents (KTP, NPWP, foto usaha, lampiran LPJ).
#
# Bring it up with:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# .env.prod lives on the server only and is never committed. Required keys are
# listed in infra/DEPLOY.md.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    # Caddy's admin API on loopback:2019 is the only endpoint that answers
    # without a valid public hostname and TLS. Probing :80 instead would just
    # measure Caddy's HTTP-to-HTTPS redirect, which answers even when the
    # config failed to load.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - web
      - api
    networks:
      - edge

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      WEB_PORT: 3000
      API_BASE_URL: http://api:3001
    expose:
      - "3000"
    # The SPA server has no /health route; it serves index.html for any path,
    # so a 200 on / means the build is present and the server is up.
    healthcheck:
      test: ["CMD", "bun", "--eval", "await fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tjsl}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      CORS_ORIGINS: https://${APP_DOMAIN}
      # One Caddy in front of the api container, so exactly one X-Forwarded-For
      # hop is ours. See apps/api/src/core/client-ip.ts: anything to the left of
      # that hop is client-supplied text and is ignored.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "bun", "--eval", "await fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:

# edge: services Caddy needs to reach. data: stateful services, no published
# ports, only the api joins both networks.
networks:
  edge:
  data:
